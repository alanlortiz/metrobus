name: Monitor Metrobus CDMX

on:
  workflow_dispatch:
    inputs:
      sentido:
        description: 'Sentido del viaje'
        required: false
        default: 'auto'
        type: choice
        options: [auto, ida, regreso]
      origen:
        description: 'Quién lo disparó (manual o programado)'
        required: false
        default: 'manual'
        type: string

concurrency:
  group: metrobus-bot
  cancel-in-progress: true

jobs:
  run-script:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: write 

    steps:
      - name: Descargar código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar librerías
        run: |
          pip install -r requirements.txt

      - name: Ejecutar script de extracción y alertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          USUARIO_API_KEY: ${{ secrets.USUARIO_API_KEY }}
          SENHA_API_KEY: ${{ secrets.SENHA_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SENTIDO: ${{ inputs.sentido }}
          ORIGEN: ${{ inputs.origen }}
        run: python alerta_metrobus.py

      - name: Guardar Historial en Repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add historial_metrobus.csv
          # La cache del GTFS estático solo existe/cambia cuando se renueva
          if [ -f gtfs_estatico.json ]; then git add gtfs_estatico.json; fi
          
          # Hacemos el commit
          git commit -m "📊 Actualiza historial de datos [skip ci]" || echo "No hay cambios para hacer commit"
          
          # 🛡️ BLINDAJE DE GIT: Descarga y fusiona cambios de último milisegundo antes de empujar
          git pull --rebase origin main
          git push
