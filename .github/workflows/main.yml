name: Monitor Metrobus CDMX

on:
  workflow_dispatch:
    inputs:
      sentido:
        description: 'Sentido del viaje'
        required: false
        default: 'auto'
        type: choice
        options: [auto, ida, regreso]
      origen:
        description: 'Quién lo disparó (manual o programado)'
        required: false
        default: 'manual'
        type: string

# Los runs se forman en fila en vez de cancelarse: /ida seguido de /regreso entrega los dos.
# (Se ejecutan uno tras otro para que no choquen al subir el historial al repo.)
concurrency:
  group: metrobus-bot
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: write 

    steps:
      - name: Descargar código
        uses: actions/checkout@v5
        with:
          # Siempre la versión más reciente de main (no la del momento del disparo):
          # un run que esperó en fila ve el historial que guardó el run anterior
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar librerías
        run: |
          pip install -r requirements.txt

      - name: Ejecutar script de extracción y alertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          USUARIO_API_KEY: ${{ secrets.USUARIO_API_KEY }}
          SENHA_API_KEY: ${{ secrets.SENHA_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SENTIDO: ${{ inputs.sentido }}
          ORIGEN: ${{ inputs.origen }}
        run: python alerta_metrobus.py

      - name: Guardar Historial en Repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add historial_metrobus.csv
          # La cache del GTFS estático solo existe/cambia cuando se renueva
          if [ -f gtfs_estatico.json ]; then git add gtfs_estatico.json; fi

          if git diff --cached --quiet; then
            echo "No hay cambios para hacer commit"
            exit 0
          fi
          git commit -m "📊 Actualiza historial de datos [skip ci]"

          # 🛡️ Hasta 3 intentos por si otro run (o tú) subió algo mientras tanto.
          # El CSV se combina solo (.gitattributes merge=union); en la cache GTFS gana la nuestra.
          for intento in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "Historial guardado (intento $intento)"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Intento $intento falló; reintentando..."
            sleep $((intento * 3))
          done
          echo "::error::No se pudo guardar el historial tras 3 intentos (el reporte de Telegram sí se envió)"
          exit 1
